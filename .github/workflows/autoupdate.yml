name: Auto-update manifests

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-package]
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      SYNC_NAME: ${{ github.event.client_payload.name || '' }}
      SYNC_TAG: ${{ github.event.client_payload.tag || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Register dispatched package
        if: ${{ github.event_name == 'repository_dispatch' }}
        run: |
          if [ -z "$SYNC_NAME" ] || [ -z "$SYNC_TAG" ]; then
            echo "::error::repository_dispatch requires client_payload.name and client_payload.tag"
            exit 1
          fi
          if ! [[ "$SYNC_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid package name: $SYNC_NAME"
            exit 1
          fi

          count=$(jq --arg name "$SYNC_NAME" '[.packages[] | select(.name == $name)] | length' registry.json)
          if [ "$count" -eq 0 ]; then
            tmp=$(mktemp)
            jq --arg name "$SYNC_NAME" '.packages += [{"name": $name, "asset": ($name + ".json"), "enabled": true}]' registry.json > "$tmp"
            mv "$tmp" registry.json
            echo "Registered and enabled $SYNC_NAME"
          fi

      - name: Sync manifests
        run: |
          if [ -n "$SYNC_NAME" ]; then
            count=$(jq --arg name "$SYNC_NAME" '[.packages[] | select(.enabled == true and .name == $name)] | length' registry.json)
            if [ "$count" -eq 0 ]; then
              echo "::error::Package $SYNC_NAME is disabled in registry.json"
              exit 1
            fi
            jq_filter='.packages[] | select(.enabled == true and .name == $name)'
            jq_args=(--arg name "$SYNC_NAME")
          else
            jq_filter='.packages[] | select(.enabled == true)'
            jq_args=()
          fi

          fail_sync() {
            echo "::error::$1"
            if [ -n "$SYNC_NAME" ]; then
              exit 1
            fi
          }

          while IFS= read -r pkg; do
            name=$(echo "$pkg" | jq -r '.name')
            asset=$(echo "$pkg" | jq -r '.asset')
            repo_slug=$(echo "$pkg" | jq -r '.repo // .name')
            repo="${OWNER}/${repo_slug}"
            ext="${asset##*.}"
            target="bucket/${name}.${ext}"

            if ! [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || [ "$ext" != "json" ]; then
              fail_sync "Invalid registry entry for $name"
              continue
            fi

            echo "::group::Syncing $name from $repo (asset $asset)"
            if [ -n "$SYNC_TAG" ]; then
              if ! release=$(curl -sfSL "https://api.github.com/repos/$repo/releases/tags/$SYNC_TAG"); then
                echo "::endgroup::"
                fail_sync "Failed to fetch release $SYNC_TAG for $name ($repo)"
                continue
              fi
            else
              if ! release=$(curl -sfSL "https://api.github.com/repos/$repo/releases/latest"); then
                echo "::endgroup::"
                fail_sync "Failed to fetch latest release for $name ($repo)"
                continue
              fi
            fi

            tag=$(echo "$release" | jq -r '.tag_name')
            url=$(echo "$release" | jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .browser_download_url')

            if [ -z "$url" ] || [ "$url" = "null" ]; then
              echo "::endgroup::"
              fail_sync "Asset $asset not found in release $tag for $name"
              continue
            fi

            tmp=$(mktemp)
            if ! curl -sfSL "$url" -o "$tmp"; then
              rm -f "$tmp"
              echo "::endgroup::"
              fail_sync "Failed to download $asset for $name"
              continue
            fi

            if ! jq empty "$tmp" 2>/dev/null; then
              rm -f "$tmp"
              echo "::endgroup::"
              fail_sync "Downloaded content is not valid JSON for $name"
              continue
            fi

            version="${tag#v}"
            manifest_version=$(jq -r '.version // empty' "$tmp")
            if [ -n "$manifest_version" ] && [ "$manifest_version" != "$version" ]; then
              echo "::warning::Manifest version ($manifest_version) does not match release tag ($version) for $name"
            fi

            mkdir -p "$(dirname "$target")"
            if cmp -s "$tmp" "$target" 2>/dev/null; then
              echo "$target already up to date ($tag)"
              rm -f "$tmp"
            else
              mv "$tmp" "$target"
              echo "Updated $target to $tag"
            fi
            echo "::endgroup::"
          done < <(jq -c "${jq_args[@]}" "$jq_filter" registry.json)

      - name: Update README
        run: |
          table_rows=$(mktemp)
          installs=$(mktemp)

          while IFS=$'\t' read -r name repo_slug; do
            file="bucket/${name}.json"
            if [ ! -f "$file" ]; then
              echo "::error::Enabled package $name is missing $file"
              exit 1
            fi

            version=$(jq -r '.version // empty' "$file")
            description=$(jq -r '.description // empty' "$file")
            [ -n "$version" ] || version="-"
            [ -n "$description" ] || description="-"
            description="${description//|/&#124;}"

            printf '| [%s](https://github.com/%s/%s) | %s | %s |\n' "$name" "$OWNER" "$repo_slug" "$version" "$description" >> "$table_rows"
            printf 'scoop install mew/%s\n' "$name" >> "$installs"
          done < <(jq -r '.packages[] | select(.enabled == true) | [.name, (.repo // .name)] | @tsv' registry.json | LC_ALL=C sort)

          {
            cat <<EOF
          # scoop-mew
          
          Scoop bucket for [mewisme](https://github.com/mewisme) packages.
          
          ## Install
          
          \`\`\`powershell
          scoop bucket add mew https://github.com/mewisme/scoop-mew
          scoop install mew/<package>
          \`\`\`
          
          ## Packages
          
          | Package | Version | Description |
          |---|---|---|
          EOF
            cat "$table_rows"
            printf '\n\`\`\`powershell\n'
            cat "$installs"
            cat <<'EOF'
          \`\`\`
          
          Manifests sync daily from each package's GitHub release asset (`*.json`).
          EOF
          } > README.md

          rm -f "$table_rows" "$installs"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json README.md bucket/
          git diff --staged --quiet && { echo "No manifest changes"; exit 0; }
          git commit -m "chore: sync scoop manifests"
          git push
